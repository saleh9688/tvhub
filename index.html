<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Hub — نسخة الويب</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="top">
  <div class="brand"><span class="logo">TV</span><span class="ttl">Hub</span></div>

  <div class="searchWrap">
    <input id="search" type="search" placeholder="ابحث عن قناة أو مباراة…" autocomplete="off" spellcheck="false">
  </div>

  <div class="tools">
    <button id="btnWorking" class="chip" title="أظهر ما له مصدر يعمل فقط">يعمل فقط</button>
    <button id="btnScan" class="chip" title="افحص مصادر ما تراه أمامك الآن">افحص المعروض</button>
    <button id="btnLogout" class="chip hidden" title="إنهاء الجلسة">خروج</button>
  </div>
</header>

<nav id="tabs"></nav>

<div id="subbar" class="hidden">
  <button id="btnBack" class="chip">‹ رجوع</button>
  <div class="subText">
    <div id="subTitle" class="subTitle"></div>
    <div id="subMeta" class="subMeta"></div>
  </div>
</div>

<main id="list"></main>

<footer id="status">جارٍ تحميل الكتالوج…</footer>

<div id="player" class="hidden">
  <div class="pTop">
    <button id="btnClose" class="chip">✕ إغلاق</button>
    <div class="pTitle" id="pTitle">—</div>
    <button id="btnNext" class="chip">المصدر التالي ›</button>
  </div>
  <div class="pStage">
    <video id="video" controls playsinline></video>
    <div id="pOverlay" class="pOverlay"></div>
  </div>
  <div class="pNote" id="pNote"></div>
</div>

<div id="toast" class="toast hidden"></div>

<!-- بوابة الدخول: تظهر فقط عندما يكون الموقع مقفلًا -->
<div id="gate" class="gate hidden">
  <form id="gateForm" class="gateCard" autocomplete="off">
    <div class="gateLogo"><span class="logo">TV</span><span class="ttl">Hub</span></div>
    <div class="gateHint">هذا الموقع محمي — أدخل بيانات الدخول للمتابعة.</div>

    <label class="gateField"><span>اسم المستخدم</span>
      <input id="gUser" type="text" autocomplete="username" spellcheck="false" autocapitalize="none">
    </label>

    <label class="gateField"><span>كلمة المرور</span>
      <input id="gPass" type="password" autocomplete="current-password">
    </label>

    <div class="gateErr" id="gErr"></div>
    <button id="gGo" class="gateBtn" type="submit">دخول</button>
    <div class="gateNote">المحتوى مشفّر AES-256 — لا يُقرأ بلا كلمة المرور.</div>
  </form>
</div>

<script src="vendor/hls.min.js"></script>
<script src="vendor/dash.all.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
